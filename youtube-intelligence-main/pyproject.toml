[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-intelligence"
version = "2.6.0"
description = "Multi-account YouTube intelligence MCP server with lazy OAuth"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx[socks]==0.28.1", "mcp==1.30.0", "cryptography==50.0.2", "PyJWT[crypto]==2.15.1", "pydantic-settings==2.16.2", "tzdata==2026.6", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pytest-cov==7.1.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
